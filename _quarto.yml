# ---------------------------------------------------------------------------
# Site-wide configuration.
#
# This file is what turns a folder of independent .qmd documents into a website with shared navigation, styling, and search.
#
# YAML is indentation-sensitive.
# Nesting is expressed with spaces, never tabs, and a misplaced space is a syntax error.
# If a render fails with a confusing message, check the indentation here first.
# ---------------------------------------------------------------------------

project:
  type: website
  output-dir: _site # compiled HTML lands here; git ignores it
  # Files listed here are copied into _site even when nothing links to them.
  # Without this the resume PDF can 404 in production while working locally.
  # Scoped to PDFs so the Word original never reaches the published site.
  resources:
    - files/*.pdf

website:
  title: "Rubén Rodríguez Barrón" # appears at the left of the navbar
  description: "Personal site of Rubén Rodríguez Barrón"
  site-url: "https://rrodriguezbarron.github.io"

  # --- Top navigation bar --------------------------------------------------
  # The CV is a direct link to the PDF rather than a page, following Molly's
  # pattern: for an academic audience it is among the most-clicked items.
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research/index.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: files/resume_2026_08.pdf
        text: CV
        target: _blank
    right:
      - icon: github
        href: https://github.com/rrodriguezbarron
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/rrodriguezbarron/
        aria-label: LinkedIn

  # --- Search --------------------------------------------------------------
  # Builds a JSON index at render time that the browser queries directly.
  # No server or third-party service is involved.
  search:
    location: navbar
    type: overlay

  page-footer:
    left: "© 2026 Rubén Rodríguez Barrón"
    right: "Built with [Quarto](https://quarto.org)"

# --- Output format ---------------------------------------------------------
# Applies to every page unless a page overrides it in its own front matter.
format:
  html:
    theme: cosmo # one of 25 built-in themes; see quarto.org/docs/output-formats/html-themes
    css: styles.css # loaded after the theme, so your rules win
    toc: true # per-page table of contents
    toc-location: right
    anchor-sections: true # hover a heading to get a linkable anchor
    link-external-newwindow: true

# --- Editor ----------------------------------------------------------------
# Tells RStudio's visual editor to write markdown back one sentence per line.
# Without this, opening a file in visual mode and saving would rewrap everything to a fixed column and undo the sentence-per-line formatting.
editor:
  markdown:
    wrap: sentence

# --- Code execution --------------------------------------------------------
# `freeze: auto` caches the output of code chunks and re-runs them only when the source document changes.
# It does nothing on pages without code.
execute:
  freeze: auto
